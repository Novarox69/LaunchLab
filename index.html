<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LaunchLab</title>
<style>
:root{--bg:#f6f5f1;--sf:#fff;--tx:#17181c;--mu:#6b6e78;--bd:#e4e2da;--ac:#e8590c;--ac2:#f59f00;--gl:rgba(232,89,12,.12)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e0f13;--sf:#171920;--tx:#eceef3;--mu:#8b90a0;--bd:#262a35;--gl:rgba(245,159,0,.1);color-scheme:dark}}
:root[data-theme=dark]{--bg:#0e0f13;--sf:#171920;--tx:#eceef3;--mu:#8b90a0;--bd:#262a35;--gl:rgba(245,159,0,.1);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;background-image:radial-gradient(60% 40% at 80% -10%,var(--gl),transparent)}
.w{max-width:980px;margin:0 auto;padding:0 20px 90px}
h1{font-size:clamp(34px,7vw,64px);line-height:1;letter-spacing:-.035em;margin:0 0 16px}
h2{font-size:16px;margin:0 0 10px}.mu{color:var(--mu);font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
.logo{font-weight:800;font-size:20px;letter-spacing:-.02em}
.logo i{font-style:normal;background:linear-gradient(120deg,var(--ac),var(--ac2));-webkit-background-clip:text;color:transparent}
.b{cursor:pointer;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;color:#fff;background:linear-gradient(120deg,var(--ac),var(--ac2));transition:transform .15s}
.b:hover{transform:translateY(-1px)}.b:disabled{opacity:.45;cursor:not-allowed;transform:none}
.b.s{background:var(--sf);color:var(--tx);border:1px solid var(--bd)}
.c{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin:14px 0}
input,textarea,select{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;margin:4px 0 10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tabs button{cursor:pointer;font:inherit;background:none;padding:7px 14px;border-radius:99px;color:var(--mu);border:1px solid var(--bd)}
.tabs .on{background:var(--gl);color:var(--ac);border-color:var(--ac)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1}
.warn{border-left:3px solid var(--ac);background:var(--gl);padding:9px 13px;border-radius:8px;margin:10px 0;font-size:14px}
.big{font-size:30px;font-weight:700;letter-spacing:-.03em}
.bar{height:6px;border-radius:9px;background:var(--bd);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .4s}
pre{white-space:pre-wrap;font:inherit;margin:0}
.hero{padding:60px 0 40px}.hero p{font-size:19px;color:var(--mu);max-width:32em;margin:0 0 24px}
</style></head><body><div class="w" id="app"></div>
<script>
/* ===== RÉGLAGES ===== */
// Adresse de ton serveur IA (à ajouter plus tard). Vide = Studio IA "non connecté".
const API_URL = "";
const COST = {idea:1, text:1, strategy:2, identity:3, video:20};
const QUOTA = 10, PERIOD = 24*3600*1000;
const ROAD = ["Recherche et préparation","Définition du concept","Création de l’identité","Développement","Tests","Marketing","Lancement","Amélioration"];
/* ===== DONNÉES (sauvegardées dans le navigateur) ===== */
const KEY = "launchlab_v1";
let S = JSON.parse(localStorage.getItem(KEY) || "null") || {name:"",type:"",goal:"",level:"",credits:QUOTA,renew:Date.now()+PERIOD,free:2,projects:[],tasks:[],log:[],theme:""};
const save = () => localStorage.setItem(KEY, JSON.stringify(S));
const E = t => String(t ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let view = "home", started = false, msg = "", out = "", tool = "idea", busy = false;
const TABS = [["home","Dashboard"],["projects","Projets"],["tasks","Tâches"],["studio","Studio IA"],["video","Vidéo"],["credits","Crédits"],["settings","Paramètres"]];
function tick(){ if(Date.now() > S.renew){ S.credits = Math.max(S.credits, QUOTA); S.renew = Date.now()+PERIOD; S.log.unshift({t:Date.now(), d:"Renouvellement quotidien", n:0}); save(); } }
function left(){ const m = Math.max(0, S.renew-Date.now()); return Math.floor(m/36e5)+" h "+String(Math.floor(m%36e5/6e4)).padStart(2,"0"); }
/* ===== ACTIONS ===== */
function go(v){ view=v; msg=""; render(); }
function onboard(e){ e.preventDefault(); const f=e.target; S.name=f.n.value.trim(); S.type=f.t.value; S.goal=f.g.value.trim(); S.level=f.l.value; save(); render(); }
function addProject(e){ e.preventDefault(); const n=e.target.n.value.trim(); if(!n) return;
  S.projects.unshift({name:n, type:e.target.t.value, desc:e.target.d.value.trim(), target:"", rev:"", arch:false, road:ROAD.map(t=>({t,done:false}))}); save(); render(); }
function addTask(e){ e.preventDefault(); const t=e.target.t.value.trim(); if(!t) return; S.tasks.push({t, p:e.target.p.value, s:0}); save(); render(); }
function mv(i){ const t=S.tasks[i]; t.s = t.s==2 ? 0 : t.s+1; save(); render(); }
function setF(i,k,v){ S.projects[i][k]=v; save(); }
function chk(i,j,v){ S.projects[i].road[j].done=v; save(); render(); }
async function studio(e){ e.preventDefault(); const q=e.target.q.value.trim(); if(!q||busy) return;
  if(!API_URL){ msg="Le Studio IA n’est pas encore connecté à un serveur. Aucune génération n’est simulée et aucun crédit n’est débité."; return render(); }
  tick(); const c=COST[tool];
  if(S.credits<c){ msg="Crédits insuffisants ("+S.credits+" disponibles, "+c+" nécessaires). Prochain renouvellement dans "+left()+"."; return render(); }
  busy=true; S.credits-=c; const L={t:Date.now(), d:"Studio : "+tool, n:-c}; S.log.unshift(L); save(); render();
  try{ const r=await fetch(API_URL,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({kind:tool,prompt:q})}); if(!r.ok) throw 0; out=(await r.json()).text||""; }
  catch(x){ S.credits+=c; L.d+=" (échec, crédits restitués)"; L.n=0; msg="La génération a échoué. Vos crédits ont été restitués."; }
  busy=false; save(); render(); }
/* ===== AFFICHAGE ===== */
function render(){ tick(); if(S.theme) document.documentElement.dataset.theme=S.theme; let h="";
  if(!S.name){
    if(!started) h=`<div class="top"><span class="logo">Launch<i>Lab</i></span><button class="b s" onclick="started=true;render()">Connexion</button></div>
    <section class="hero"><h1>De l’idée au lancement. Tout au même endroit.</h1><p>Transformez une idée en projet organisé : roadmap, tâches et suivi, au même endroit.</p>
    <div class="row"><button class="b" onclick="started=true;render()">Commencer gratuitement</button><button class="b s" onclick="document.getElementById('f').scrollIntoView({behavior:'smooth'})">Découvrir la plateforme</button></div></section>
    <div class="g" id="f"><div class="c"><h2>Projets</h2><p class="mu">Créez plusieurs projets, avec une roadmap en 8 étapes.</p></div><div class="c"><h2>Tâches</h2><p class="mu">Liste et vue Kanban, avec priorités.</p></div><div class="c"><h2>Crédits</h2><p class="mu">Crédits gratuits renouvelés chaque jour.</p></div></div>`;
    else h=`<div style="max-width:440px;margin:60px auto 0"><form class="c" onsubmit="onboard(event)"><h2>Bienvenue sur LaunchLab</h2>
    <input name="n" placeholder="Votre prénom ou pseudo" required><select name="t"><option>Startup</option><option>Application</option><option>Site web</option><option>Marque</option><option>Chaîne TikTok</option><option>Compte Instagram</option><option>Projet gaming</option><option>Association</option><option>Autre</option></select>
    <input name="g" placeholder="Votre objectif" required><select name="l"><option>Débutant</option><option>Intermédiaire</option><option>Expérimenté</option></select><button class="b" style="width:100%">Accéder au dashboard</button></form></div>`;
    document.getElementById("app").innerHTML=h; return; }
  const P=S.projects.filter(p=>!p.arch), done=S.tasks.filter(t=>t.s==2).length;
  h=`<div class="top"><span class="logo">Launch<i>Lab</i></span><span class="mu">${S.credits} crédits</span></div>
  <div class="tabs">${TABS.map(([k,n])=>`<button class="${k==view?"on":""}" onclick="go('${k}')">${n}</button>`).join("")}</div>${msg?`<div class="warn">${E(msg)}</div>`:""}`;
  if(view=="home") h+=`<h1 style="font-size:34px">Bonjour ${E(S.name)}</h1><div class="g">
  <div class="c"><div class="big">${P.length}</div><span class="mu">projets actifs</span></div>
  <div class="c"><div class="big">${S.tasks.length-done}</div><span class="mu">tâches à faire</span></div>
  <div class="c"><div class="big">${S.credits}</div><span class="mu">crédits · renouvellement dans ${left()}</span></div></div>
  <div class="c"><h2>Progression des tâches</h2><div class="bar"><i style="width:${S.tasks.length?done/S.tasks.length*100:0}%"></i></div><span class="mu">${done}/${S.tasks.length} terminées</span></div>`;
  if(view=="projects") h+=`<form class="c" onsubmit="addProject(event)"><h2>Nouveau projet</h2><input name="n" placeholder="Nom du projet" required>
  <select name="t"><option>Startup</option><option>Application</option><option>Site web</option><option>Marque</option><option>Chaîne TikTok</option><option>Compte Instagram</option><option>Projet gaming</option><option>Association</option><option>Autre</option></select>
  <textarea name="d" rows="2" placeholder="Décrivez votre idée"></textarea><button class="b">Créer le projet</button></form>
  <div class="g">${S.projects.map((p,i)=>{const k=p.road.filter(x=>x.done).length;return `<div class="c" style="opacity:${p.arch?.5:1}"><h2>${E(p.name)} <span class="mu">· ${E(p.type)}</span></h2>
  <textarea rows="2" placeholder="Description" onchange="setF(${i},'desc',this.value)">${E(p.desc)}</textarea>
  <input placeholder="Public cible" value="${E(p.target)}" onchange="setF(${i},'target',this.value)"><input placeholder="Sources de revenus" value="${E(p.rev)}" onchange="setF(${i},'rev',this.value)">
  <div class="bar"><i style="width:${k/p.road.length*100}%"></i></div><span class="mu">Roadmap ${k}/${p.road.length}</span>
  ${p.road.map((x,j)=>`<label style="display:block"><input type="checkbox" style="width:auto;margin:0 6px 0 0" ${x.done?"checked":""} onchange="chk(${i},${j},this.checked)">${E(x.t)}</label>`).join("")}
  <div class="row" style="margin-top:10px"><button class="b s" onclick="S.projects[${i}].arch=!S.projects[${i}].arch;save();render()">${p.arch?"Désarchiver":"Archiver"}</button><button class="b s" onclick="if(confirm('Supprimer ce projet ?')){S.projects.splice(${i},1);save();render()}">Supprimer</button></div></div>`}).join("")||`<p class="mu">Aucun projet. Créez le premier ci-dessus.</p>`}</div>`;
  if(view=="tasks") h+=`<form class="c row" onsubmit="addTask(event)"><input class="grow" name="t" placeholder="Nouvelle tâche"><select name="p" style="width:auto"><option>haute</option><option selected>moyenne</option><option>basse</option></select><button class="b">Ajouter</button></form>
  <div class="g">${["À faire","En cours","Terminé"].map((n,s)=>`<div class="c"><h2>${n}</h2>${S.tasks.map((t,i)=>[t,i]).filter(([t])=>t.s==s).map(([t,i])=>`<div class="row" style="margin-bottom:8px"><span class="grow">${E(t.t)} <span class="mu">(${t.p})</span></span><button class="b s" onclick="mv(${i})">${s==2?"↺":"→"}</button><button class="b s" onclick="S.tasks.splice(${i},1);save();render()">✕</button></div>`).join("")}</div>`).join("")}</div>`;
  if(view=="studio") h+=`<div class="c"><div class="row">${[["idea","Idées"],["text","Textes"],["strategy","Stratégie"],["identity","Identité"]].map(([k,n])=>`<button class="b ${k==tool?"":"s"}" onclick="tool='${k}';render()">${n}</button>`).join("")}</div>
  <p class="mu">Coût : ${COST[tool]} crédit(s) · solde ${S.credits}</p><form onsubmit="studio(event)"><textarea name="q" rows="3" placeholder="Décrivez votre sujet…"></textarea><button class="b" ${busy?"disabled":""}>${busy?"Génération…":"Générer"}</button></form>
  ${out?`<div class="c" style="margin-top:12px"><pre>${E(out)}</pre><button class="b s" onclick="navigator.clipboard.writeText(out)">Copier</button></div>`:""}</div>`;
  if(view=="video") h+=`<div class="c"><h2>Générateur vidéo</h2><div class="warn">Aucun moteur de génération vidéo n’est connecté. Aucune vidéo n’est simulée.</div><p><b>Il vous reste ${S.free} vidéo(s) gratuite(s).</b></p><button class="b" disabled>Générer la vidéo</button></div>`;
  if(view=="credits") h+=`<div class="g"><div class="c"><div class="big">${S.credits}</div><span class="mu">crédits · renouvellement dans ${left()}</span></div><div class="c"><h2>Coûts</h2>${Object.entries(COST).map(([k,v])=>`<div class="row"><span class="grow">${k}</span><b>${v}</b></div>`).join("")}</div></div>
  <div class="warn">Packs, abonnement Premium et paiement : à brancher avec un serveur (Stripe).</div><div class="c"><h2>Historique</h2>${S.log.slice(0,15).map(l=>`<div class="row"><span class="grow">${E(l.d)}</span><span class="mu">${new Date(l.t).toLocaleString("fr-FR")}</span><b>${l.n||""}</b></div>`).join("")||`<p class="mu">Aucune consommation.</p>`}</div>`;
  if(view=="settings") h+=`<div class="c"><h2>Profil</h2><input value="${E(S.name)}" onchange="S.name=this.value.trim()||S.name;save()"><p class="mu">Objectif : ${E(S.goal)} · Niveau : ${E(S.level)}</p>
  <div class="row"><button class="b s" onclick="S.theme=document.documentElement.dataset.theme=='dark'?'light':'dark';save();render()">Changer de thème</button>
  <button class="b s" onclick="if(confirm('Tout effacer sur cet appareil ?')){localStorage.removeItem(KEY);location.reload()}">Supprimer mes données</button></div></div>`;
  document.getElementById("app").innerHTML=h; }
render(); setInterval(()=>{ if(S.name) render(); }, 60000);
</script></body></html>
